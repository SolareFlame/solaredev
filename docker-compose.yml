# Local Postgres for the back (DATABASE_URL in back/.env.example).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: solaredev
      POSTGRES_PASSWORD: solaredev
      POSTGRES_DB: solaredev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
