# Serves the Vite build and relays /api to the back: the whole site is one origin, like with
# Vite's dev proxy. TLS and the public hostname are Caddy's job, in front of this in prod.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Relative redirects: nginx doesn't know the public scheme, host or port.
    absolute_redirect off;

    # Docker's DNS, re-resolved so a recreated back container (new IP) is picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # A variable makes nginx resolve at request time, and start even if the back is down.
        set $back http://solaredev-back:3000;
        proxy_pass $back;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite fingerprints every file under /assets: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html and public/ files keep their names: always revalidated.
    # No client-side router, so unknown paths are real 404s.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
